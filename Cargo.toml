[workspace]
members = [
    "crates/oz-cli",
    "crates/oz-objects",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/oz-docs/oz"
rust-version = "1.82"

[workspace.dependencies]
anyhow = "1.0.95"
base64 = "0.22.1"
chrono = { version = "0.4.39", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5.27", features = ["derive"] }
dirs = "5.0.1"
ed25519-dalek = "2.1.1"
hex = "0.4.3"
oz-objects = { path = "crates/oz-objects" }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
sha2 = "0.10.8"
tempfile = "3.15.0"
ureq = { version = "2.12.1", features = ["json"] }
walkdir = "2.5.0"
zstd = "0.13.2"
