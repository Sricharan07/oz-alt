{
  "library": "tailwindlabs/tailwindcss",
  "version": "4",
  "checks": [
    {
      "name": "utility classes responsive",
      "query": "Tailwind CSS responsive utility classes hover state",
      "patterns": ["utility|utilities", "responsive", "hover"],
      "expected_files": [
        "examples/styling-with-utility-classes.md",
        "examples/hover-focus-and-other-states.md",
        "guides/installation/tailwind-cli.md",
        "guides/get-started-with-tailwind-css.md"
      ],
      "must_include": ["utility", "responsive"],
      "banned_paths": ["/(showcase|sponsor|blog)"]
    }
  ]
}
