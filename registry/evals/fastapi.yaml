{
  "library": "tiangolo/fastapi",
  "version": "latest",
  "checks": [
    {
      "name": "path operation dependency",
      "query": "FastAPI path operation dependency Depends response model",
      "patterns": ["path operation", "Depends|dependency", "response model"],
      "expected_files": [
        "_symbols/FastAPI.md",
        "_symbols/Path.md",
        "_symbols/Response.md",
        "examples/dependencies.md",
