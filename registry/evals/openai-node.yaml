{
  "library": "openai/openai-node",
  "version": "latest",
  "checks": [
    {
      "name": "streaming chat completions",
      "query": "streaming chat completions client",
      "patterns": ["stream|streaming", "chat.completions|chat completions|responses", "OpenAI"],
      "expected_files": [
        "api-reference/openai/openai-node/master/readme.md",
        "guides/openai/openai-node/master/readme.md",
        "_symbols/OpenAI.md"
      ],
      "must_include": ["OpenAI", "stream", "chat"],
      "banned_content": ["GitHub · Change is constant", "Enter your email", "Try GitHub Copilot"]
    },
    {
      "name": "embeddings",
      "query": "create embeddings with OpenAI client",
      "patterns": ["embedding|embeddings", "OpenAI|client"],
      "expected_files": [
        "api-reference/openai/openai-node/master/readme.md",
        "guides/openai/openai-node/master/readme.md",
        "_symbols/embeddings.md"
      ],
      "must_include": ["embedding", "OpenAI"],
      "banned_content": ["GitHub · Change is constant"]
    }
  ]
}
