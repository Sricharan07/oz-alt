server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  resolver 127.0.0.11 valid=10s ipv6=off;
  set $oz_api http://oz-api:8765;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_connect_timeout 3s;
  proxy_read_timeout 60s;
  proxy_send_timeout 60s;

  location = /healthz {
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location = /config.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
    try_files /config.js =404;
  }

  location = /login { proxy_pass $oz_api; }
  location = /signup { proxy_pass $oz_api; }
  location ^~ /account { proxy_pass $oz_api; }
  location ^~ /invite { proxy_pass $oz_api; }
  location ^~ /reset-password { proxy_pass $oz_api; }
  location ^~ /auth/ { proxy_pass $oz_api; }

  location = /catalog { proxy_pass $oz_api; }
  location = /libraries.json { proxy_pass $oz_api; }
  location ^~ /api/ { proxy_pass $oz_api; }
  location ^~ /refs { proxy_pass $oz_api; }
  location ^~ /pack { proxy_pass $oz_api; }
  location = /search { proxy_pass $oz_api; }
  location = /suggest { proxy_pass $oz_api; }
  location = /context { proxy_pass $oz_api; }
  location = /telemetry { proxy_pass $oz_api; }
  location = /status.json { proxy_pass $oz_api; }
  location = /health { proxy_pass $oz_api; }
  location = /privacy { proxy_pass $oz_api; }
  location = /terms { proxy_pass $oz_api; }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
