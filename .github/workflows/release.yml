name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v prefix"
        required: true

jobs:
  build-required:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: oz-linux-x64
            binary: oz
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            asset: oz-linux-arm64
            binary: oz
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            asset: oz-darwin-arm64
            binary: oz
            target: aarch64-apple-darwin
          - os: macos-14
            asset: oz-darwin-x64
            binary: oz
            target: x86_64-apple-darwin
          - os: windows-latest
            asset: oz-win32-x64.exe
            binary: oz.exe
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build CLI
        shell: bash
        run: cargo build --release -p oz --target "${{ matrix.target }}"
      - name: Stage asset
        shell: bash
        run: |
          mkdir -p dist
          bin="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          cp "$bin" "dist/${{ matrix.asset }}"
          if command -v shasum >/dev/null 2>&1; then
            (cd dist && shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256")
          else
            (cd dist && sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256")
          fi
          if [[ "${{ matrix.asset }}" == *.exe ]]; then
            powershell -NoProfile -Command "Compress-Archive -Path 'dist/${{ matrix.asset }}' -DestinationPath 'dist/${{ matrix.asset }}.zip' -Force"
          else
            cp "$bin" "dist/oz"
            tar -czf "dist/${{ matrix.asset }}.tar.gz" -C dist oz
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
            dist/${{ matrix.asset }}.tar.gz
            dist/${{ matrix.asset }}.zip
          if-no-files-found: ignore

  publish-required:
    needs: build-required
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate release manifest and SBOM
        run: |
          version="${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || github.ref_name }}"
          version="${version#v}"
          python scripts/generate-release-manifest.py --dist dist --version "$version" --output dist/release-manifest.json --sbom dist/sbom.spdx.json
          python scripts/verify-release-artifacts.py --dist dist --manifest dist/release-manifest.json --sbom dist/sbom.spdx.json
          python scripts/extract-release-notes.py --version "$version" --output dist/release-notes.md
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*
      - uses: softprops/action-gh-release@v2
        with:
          repository: Sricharan07/oz
          token: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          tag_name: ${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || github.ref_name }}
          body_path: dist/release-notes.md
          overwrite_files: true
          files: dist/*
