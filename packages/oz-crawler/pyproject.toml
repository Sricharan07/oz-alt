[project]
name = "oz-crawler"
version = "0.1.0"
description = "Scrapling-based documentation crawler for Oz registry fixtures."
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "cryptography>=42.0.0",
    "markdownify>=0.14.1",
    "lxml>=6.1.0",
    "cssselect>=1.4.0",
    "orjson>=3.11.8",
    "tld>=0.13.2",
    "w3lib>=2.4.1",
    "typing_extensions",
    "click>=8.3.0",
    "curl_cffi>=0.15.0",
    "playwright==1.59.0",
    "patchright==1.59.1",
    "browserforge>=1.2.4",
    "apify-fingerprint-datapoints>=0.13.0",
    "msgspec>=0.21.1",
    "anyio>=4.13.0",
    "protego>=0.6.0",
    "tree-sitter-language-pack>=0.9.1",
    "tiktoken>=0.12.0",
]

[project.scripts]
oz-crawl = "oz_crawler.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oz_crawler"]
