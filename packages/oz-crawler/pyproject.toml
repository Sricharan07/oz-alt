[project]
name = "oz-crawler"
version = "0.1.0"
description = "Scrapling-based documentation crawler for Oz registry fixtures."
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "markdownify>=0.14.1",
    "scrapling @ git+https://github.com/D4Vinci/Scrapling.git",
]

[project.scripts]
oz-crawl = "oz_crawler.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oz_crawler"]

