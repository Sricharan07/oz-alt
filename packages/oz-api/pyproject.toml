[project]
name = "oz-api"
version = "0.1.0"
description = "Local Oz registry API for end-to-end development."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
oz-api = "oz_api.server:main"
oz-index-registry = "oz_api.indexer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oz_api"]
