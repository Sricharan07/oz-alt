[project]
name = "oz-api"
version = "0.1.0"
description = "Local Oz registry API for end-to-end development."
requires-python = ">=3.11"
dependencies = [
    "argon2-cffi>=23.1.0",
    "boto3>=1.35.0",
    "fastapi>=0.115.0",
    "psycopg[binary]>=3.2.0",
    "redis>=5.0.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
oz-api = "oz_api.server:main"
oz-index-registry = "oz_api.indexer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oz_api"]
